<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="32" cy="32" r="32" fill="url(#grad)"/>

  <!-- Geometric element: partial circle/arc representing mathematics -->
  <path d="M 16 32 A 16 16 0 0 1 32 16" stroke="#3498db" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 32 48 A 16 16 0 0 1 48 32" stroke="#3498db" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Text: LF -->
  <text x="32" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ecf0f1" text-anchor="middle">LF</text>
</svg>